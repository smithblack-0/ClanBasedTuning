name: M3 admission research probe

on:
  push:
    branches:
      - research/m3-admission-probe-2026-07-30
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact Ray
        run: python -m pip install "ray[tune]==2.56.0"
      - name: Run admission probe
        run: python research/admission_probe.py
