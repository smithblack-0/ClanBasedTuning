name: tests

on:
  push:
  pull_request:

jobs:
  unit-and-lightning-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install 'torch>=2.10,<2.11' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - name: Run validation and capture output
        shell: bash
        run: |
          set -eo pipefail
          {
            echo '$ python -m ruff check .'
            python -m ruff check .
            echo
            echo '$ python -m ruff format --check .'
            python -m ruff format --check .
            echo
            echo "$ python -m pytest -m 'not requires_ray'"
            python -m pytest -m 'not requires_ray'
          } 2>&1 | tee workflow_logs.log
      - name: Upload workflow logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-logs-unit-${{ matrix.python-version }}
          path: workflow_logs.log

  ray-native-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install 'torch>=2.10,<2.11' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,ray]'
      - name: Run Ray contracts and capture output
        shell: bash
        run: |
          set -eo pipefail
          {
            echo '$ python -m pytest -m requires_ray -vv'
            python -m pytest -m requires_ray -vv
          } 2>&1 | tee workflow_logs.log
      - name: Upload workflow logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-logs-ray-3.11
          path: workflow_logs.log
