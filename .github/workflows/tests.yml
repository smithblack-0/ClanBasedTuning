name: tests

on:
  push:
  pull_request:

jobs:
  unit-and-lightning-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install 'torch>=2.10,<2.11' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - name: Check formatting and capture output
        shell: bash
        run: |
          set +e
          python -m ruff format --check . > ruff-format.log 2>&1
          status=$?
          cat ruff-format.log
          exit "$status"
      - name: Upload formatter output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-format-${{ matrix.python-version }}
          path: ruff-format.log
      - run: python -m pytest -m 'not requires_ray'

  ray-native-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install 'torch>=2.10,<2.11' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,ray]'
      - run: python -m pytest -m requires_ray -vv
